<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesas Millonarias - Sorteo</title>
    <script src="canal.js"></script>
    <link rel="stylesheet" href="css/sorteo.css">
    <!-- Hoja aparte, vacía: aquí el JS agrega en vivo una regla .color-xxxx por cada
         color configurado en el panel de control (ver generarClasesColores en js/sorteo.js). -->
    <style id="estilos-dinamicos"></style>
</head>
<body>
    <div class="escenario-sorteo tema-original" id="escenario-sorteo">
        <img src="img/fondo-sorteo.png" alt="Estamos Sorteando en promocionales" class="fondo-imagen" id="fondo-imagen">
        <div class="texto-monto" id="caja-monto"><span id="texto-monto-premio">100.000</span></div>
        <div class="texto-subtitulo" id="caja-subtitulo"><span>En promocionales</span></div>
        <div id="reel-mesa" class="reel-caja"><span class="reel-texto">—</span></div>
        <div id="reel-ganador" class="reel-caja"><span class="reel-texto">—</span></div>
    </div>

    <button id="btn-config-remota" title="Configurar sincronización remota">⚙</button>

    <div id="mensaje-estado" class="mensaje-estado">Haz clic en cualquier lugar para iniciar el sorteo</div>

    <div id="confetti-container" class="confetti-container"></div>

    <footer>
        <p>CarlosPN Interactive®</p>
    </footer>

    <script src="js/sorteo.js"></script>
</body>
</html>
