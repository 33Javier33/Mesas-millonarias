<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesas Millonarias - Panel de Control</title>
    <link rel="stylesheet" href="css/index.css">
    <script src="canal.js"></script>
</head>
<body>
    <div class="contenedor-configuracion">
        <h3>Panel de Control</h3>

        <div class="control-seccion">
            <h4>Control de Pantalla de Sorteo</h4>
            <div class="control-botones">
                <button id="btn-lanzar-pantalla" class="btn">Lanzar Pantalla</button>
                <button id="btn-iniciar-sorteo" class="btn" title="Iniciar Sorteo" disabled>▶️ Iniciar Sorteo</button>
                <button id="btn-premio" class="btn" title="Entregar Premio" disabled>🎉</button>
                <span id="status-pantalla" class="desconectado">Desconectado</span>
            </div>
             <p style="font-size: 0.8em; text-align: center; opacity: 0.7; margin-top: 10px;">
                <strong>Nota:</strong> Si la pantalla no aparece, revisa que tu navegador no esté bloqueando las ventanas emergentes.
            </p>

            <div class="tiempos-suspenso">
                <div class="input-group">
                    <label for="input-monto-premio">💰 Premio:</label>
                    <input type="number" id="input-monto-premio" min="0" step="1000" placeholder="Ej: 100000">
                    <span id="monto-premio-preview" class="monto-preview"></span>
                </div>
                <div class="input-group">
                    <label for="input-duracion-mesa">⏱️ Mesa (seg):</label>
                    <input type="number" id="input-duracion-mesa" min="1" max="20" step="0.5">
                </div>
                <div class="input-group">
                    <label for="input-duracion-ganador">⏱️ Ganador (seg):</label>
                    <input type="number" id="input-duracion-ganador" min="1" max="20" step="0.5">
                </div>
                <label class="input-group check-confeti">
                    <input type="checkbox" id="input-confeti-activado">
                    🎊 Confeti
                </label>
                <label class="input-group check-confeti">
                    <input type="checkbox" id="input-mensaje-activado">
                    💬 Mensaje
                </label>
                <label class="input-group check-confeti" title="Destellos sutiles tipo fuegos artificiales (solo se ven en Tema 2 y Tema 3)">
                    <input type="checkbox" id="input-fuegos-activado">
                    🎆 Fuegos
                </label>
                <label class="input-group check-confeti" title="Ráfagas de confeti explosivo de fondo (solo se ven en Tema 2 y Tema 3)">
                    <input type="checkbox" id="input-confeti-explosivo-activado">
                    🎇 Confeti explosivo
                </label>
            </div>

            <div class="iconos-avanzados">
                <button type="button" class="btn-icono" id="btn-sync-remota-avanzado" title="Sincronización remota: ya viene conectada automáticamente. Click solo para usar un backend distinto en este dispositivo.">🌐</button>
            </div>
        </div>

        <details class="config-seccion">
            <summary class="resumen-seccion">Tema de la Pantalla de Sorteo</summary>
            <div class="selector-temas" id="selector-temas">
                <label class="tema-opcion">
                    <input type="radio" name="tema-sorteo" value="original">
                    <img src="img/fondo-sorteo.png" alt="Tema Original">
                    <span>Original</span>
                </label>
                <label class="tema-opcion">
                    <input type="radio" name="tema-sorteo" value="tema2">
                    <img src="img/fondo-tema2.jpg" alt="Tema 2">
                    <span>Tema 2</span>
                </label>
                <label class="tema-opcion">
                    <input type="radio" name="tema-sorteo" value="tema3">
                    <img src="img/fondo-tema3.jpg" alt="Tema 3">
                    <span>Tema 3</span>
                </label>
            </div>
        </details>
        <details class="config-seccion" open>
            <summary class="resumen-seccion">Mesas en juego</summary>
            <div class="botones-opciones">
                <button class="btn-opcion" onclick="toggleCheckboxes('mesas-en-juego', true)">Seleccionar todos</button>
                <button class="btn-opcion" onclick="toggleCheckboxes('mesas-en-juego', false)">Desmarcar todos</button>
            </div>
            <ul class="lista-opciones" id="lista-mesas-juego"></ul>
            <div class="input-group">
                <input type="text" id="nueva-mesa-input" placeholder="Nombre de la nueva mesa">
                <button class="btn btn-agregar" id="btn-agregar-mesa">Agregar</button>
            </div>
        </details>
        <details class="config-seccion" open>
            <summary class="resumen-seccion">Colores de Ruletas</summary>
            <details>
                <summary class="resumen-subseccion">Ruleta 21, 24 y 25</summary>
                <div class="botones-opciones">
                    <button class="btn-opcion" onclick="toggleCheckboxes('colores-ruleta-21', true)">Seleccionar todos</button>
                    <button class="btn-opcion" onclick="toggleCheckboxes('colores-ruleta-21', false)">Desmarcar todos</button>
                </div>
                <ul class="lista-opciones" id="lista-colores-21"></ul>
                <div class="input-group">
                    <input type="text" id="nuevo-color-nombre-21-input" placeholder="Nombre del color">
                    <input type="color" id="nuevo-color-hex-21-input" value="#e66465">
                    <button class="btn btn-agregar" id="btn-agregar-color-21">Agregar</button>
                </div>
            </details>
            <details>
                <summary class="resumen-subseccion">Ruleta 22</summary>
                <div class="botones-opciones">
                    <button class="btn-opcion" onclick="toggleCheckboxes('colores-ruleta-22', true)">Seleccionar todos</button>
                    <button class="btn-opcion" onclick="toggleCheckboxes('colores-ruleta-22', false)">Desmarcar todos</button>
                </div>
                <ul class="lista-opciones" id="lista-colores-22"></ul>
                <div class="input-group">
                    <input type="text" id="nuevo-color-nombre-22-input" placeholder="Nombre del color">
                    <input type="color" id="nuevo-color-hex-22-input" value="#f6b73c">
                    <button class="btn btn-agregar" id="btn-agregar-color-22">Agregar</button>
                </div>
            </details>
            <details>
                <summary class="resumen-subseccion">Ruleta 23</summary>
                <div class="botones-opciones">
                    <button class="btn-opcion" onclick="toggleCheckboxes('colores-ruleta-23', true)">Seleccionar todos</button>
                    <button class="btn-opcion" onclick="toggleCheckboxes('colores-ruleta-23', false)">Desmarcar todos</button>
                </div>
                <ul class="lista-opciones" id="lista-colores-23"></ul>
                <div class="input-group">
                    <input type="text" id="nuevo-color-nombre-23-input" placeholder="Nombre del color">
                    <input type="color" id="nuevo-color-hex-23-input" value="#563cf6">
                    <button class="btn btn-agregar" id="btn-agregar-color-23">Agregar</button>
                </div>
            </details>
        </details>
    </div>
    <div class="barra-guardar-flotante">
        <button id="btn-guardar" class="btn btn-guardar">Guardar y Sincronizar</button>
    </div>

    <script src="js/index.js"></script>
</body>
</html>
